function makeLearners(){
  const jobs=['Haul Truck Operator','Plant Operator','Maintenance Technician','General Miner','Heavy Equipment Operator','Supervisor','Environmental Technician','Electrician','Contractor - Service'];
  return Array.from({length:240},(_,i)=>{
    const [first,last]=names[i%names.length];
    const site=i<140?'quartette':'spirit';
    const job=jobs[(i*7+Math.floor(i/17))%jobs.length];
    return {id:`W-${String(i+1).padStart(3,'0')}`,name:`${first} ${names[Math.floor(i/names.length)%names.length][1]}`,site,job,contractor:job.startsWith('Contractor'),kind:'fictional'};
  });
}

  {

const STORAGE_KEY = 'skyfire-education-demo-v01';
let state;
let inMemoryOnly=false;
const listeners=new Set();
const clone=x=>JSON.parse(JSON.stringify(x));
function load(){
  if(state)return state;
  try {
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved){const parsed=JSON.parse(saved);if(parsed.schema===1&&Array.isArray(parsed.courses)&&Array.isArray(parsed.learners))state=parsed;}
  } catch {inMemoryOnly=true;}
  state ||=freshState();return state;
}
function getState(){return load();}
function isMemoryOnly(){return inMemoryOnly;}
function save(mutator){
  const draft=clone(load());mutator(draft);state=draft;
  try {localStorage.setItem(STORAGE_KEY,JSON.stringify(state));inMemoryOnly=false;} catch {inMemoryOnly=true;}
  for(const cb of listeners)cb(state);
}
function subscribe(cb){listeners.add(cb);return()=>listeners.delete(cb);}
function reset(){state=freshState();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));inMemoryOnly=false;}catch{inMemoryOnly=true;}for(const cb of listeners)cb(state);}
function exportDemo(){const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='skyfire-education-fictional-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importDemo(file){
 const value=JSON.parse(await file.text());
 if(value.schema!==1||!Array.isArray(value.courses)||!Array.isArray(value.learners)||!Array.isArray(value.assignments)||!value.progress||!Array.isArray(value.evaluations))throw new Error('Incompatible demo export');
 if(value.learners.some(x=>x.kind!=='fictional'))throw new Error('Only fictional demo records are accepted');
 state=value;
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));inMemoryOnly=false;}catch{inMemoryOnly=true;}
 for(const cb of listeners)cb(state);
}
const progressFor=(courseId,learnerId)=>getState().progress[`${courseId}:${learnerId}`]||{completed:[],quiz:null,scenario:null};
function updateProgress(courseId,learnerId,patch){
 save(s=>{const key=`${courseId}:${learnerId}`;const p=s.progress[key]||{completed:[],quiz:null,scenario:null};s.progress[key]={...p,...patch,updatedAt:new Date().toISOString()};});
}
const assigned=(courseId,learnerId)=>getState().assignments.some(a=>a.courseId===courseId&&a.learnerId===learnerId);
function assignCourse(courseId,ids){
 save(s=>{for(const learnerId of ids)if(!s.assignments.some(a=>a.courseId===courseId&&a.learnerId===learnerId))s.assignments.push({courseId,learnerId,assignedAt:new Date().toISOString().slice(0,10)});});
}
function courseCompletion(course,learnerId){
 const p=progressFor(course.id,learnerId);return {done:course.lessons.filter(l=>p.completed.includes(l.id)).length,total:course.lessons.length,ready:course.lessons.every(l=>p.completed.includes(l.id))};
}

function studio(){const c=course(ui.studioCourseId)||getState().courses[0];if(!c)return intro('Instructor Studio','No courses available.');const eligible=getState().learners.filter(x=>ui.site==='all'||x.site===ui.site);return intro('Instructor Studio','Build lessons, present coursework, assign training, and record practical observations.')+`<div class="notice" style="margin-bottom:18px">Prototype instructor tools use simulated roles. There are no private instructor notes, identity verification, authorization controls, or shared records yet.</div><section class="section"><div class="spread"><h2>Course authoring</h2>${badge('Working course builder','green')}</div><label class="form-field"><span class="section-label">Choose a course to edit</span><select id="studioCourseSelect">${getState().courses.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="flex" style="margin:12px 0">${button('Open learner course','open-course',`data-course="${esc(c.id)}"`)}${button('Present this course','present-course',`data-course="${esc(c.id)}"`,'btn primary')}</div><form data-form="edit-course"><div class="form-grid"><div class="form-field"><label for="editTitle">Course title</label><input required maxlength="120" id="editTitle" name="title" value="${esc(c.name)}"></div><div class="form-field"><label for="editAcademy">Learning pathway</label><select id="editAcademy" name="academy">${ACADEMIES.map(x=>`<option value="${esc(x)}" ${c.academy===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="form-field"><label for="editScope">Site scope</label><select name="scope" id="editScope"><option value="all" ${c.scope==='all'?'selected':''}>Both sites</option>${SITES.map(x=>`<option value="${x.id}" ${c.scope===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="form-field"><label for="editAudience">Intended audience</label><input name="audience" id="editAudience" maxleng ew course name"></div><div class="form-field"><label for="newAcademy">Learning pathway</label><select id="newAcademy" name="academy">${ACADEMIES.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="form-field"><label for="newCourseSummary">Course description</label><textarea id="newCourseSummary" name="summary" required placeholder="What will learners study?"></textarea></div><button type="submit" class="btn primary">Create demo course</button></form><hr style="border:0;border-top:1px solid var(--line-soft);margin:22px 0"><h2>Assign training</h2><form data-form="assign-course" class="stack"><div class="form-field"><label for="assignTo">Assign ${esc(c.name)} to</label><select name="target" id="assignTo"><option value="one">Selected learner</option><option value="site">All fictional workers in current site filter</option></select></div><div class="form-field"><label for="assignLearner">Learner</label><select id="assignLearner" name="learnerId">${eligible.slice(0,100).map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.id} · ${esc(siteName(p.site))}</option>`).join('')}</select></div><button class="btn" type="submit">Assign course</button></form></section></div><section class="section"><h2>Practical competency evaluation</h2><p class="muted small">Sample evaluator checklist; not proof of a legal qualification or regulatory completion. Only a final approved operational process would create authoritative evidence.</p><form data-form="evaluation" class="stack"><div class="form-grid"><div class="form-field"><label for="evalLearner">Fictional learner</label><select id="evalLearner" name="learnerId">${eligible.slice(0,100).map(p=>`<option value="${p.id}" ${p.id===ui.learnerId?'selected':''}>${esc(p.name)} (${p.id})</option>`).join('')}</select></div><div class="form-field"><label for="evalEvaluator">Demo evaluator name</label><input id="evalEvaluator" name="evaluator" required value="Demo Instructor" maxlength="90"></div></div><div class="checklist">${(c.checklist?.length?c.checklist:['Communicates the task hazards and required controls','Demonstrates the expected procedure','Responds appropriately to an unexpected condition']).map((x,i)=>`<label class="check-row"><input type="checkbox" name="check${i}" required/><span>${esc(x)}</span></label>`).join('')}</div><div class="form-field"><label for="evalNote">Evaluator observation notes</label><textarea id="evalNote" name="notes" placeholder="Describe observed behaviors, corrective coaching, and any follow-up required..."></textarea></div><button type="submit" class="btn primary">Record fictional evaluation</button></form></section>`;}
function matrix(){const s=getState();const rows=shownLearners().filter(l=>`${l.name} ${l.job} ${l.id}`.toLowerCase().includes(ui.matrixSearch.toLowerCase()));const courseId='powered-haulage';const perPage=30;const pages=Math.max(1,Math.ceil(rows.length/perPage));ui.matrixPage=Math.min(Math.max(1,ui.matrixPage),pages);const pageRows=rows.slice((ui.matrixPage-1)*perPage,ui.matrixPage*perPage);return intro('Training Matrix','A working demonstration of personnel assignments, lesson progress, and evaluation evidence.')+`<div class="notice" style="margin-bottom:18px">This matrix tracks learning progress, not legal qualification or MSHA training certification. Role/site policies are illustrative and have not been approved by mine leadership.</div>${metrics()}<section class="section"><div class="spread"><h2>Powered Haulage Safety · people view</h2>${button('Export matrix CSV','export-matrix','','btn primary small')}</div><div class="filter-row"><input aria-label="Search employees" id="matrixSearch" placeholder="Search fictional worker or role..." value="${esc(ui.matrixSearch)}"><span class="muted small">${rows.length} workers · Page ${ui.matrixPage} of ${pages}</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Worker</th><th>Site</th><th>Role</th><th>Learning status</th><th>Practical</th><th>MSHA certificate</th></tr></thead><tbody>${pageRows.map(p=>{const st=outcome(courseId,p.id),c=course(courseId),n=courseCompletion(c,p.id),ev=evaluation(courseId,p.id);return `<tr><td><button class="btn small" data-action="open-record" data-learner="${p.id}">${esc(p.name)}</button><br><span class="tiny muted">${p.id}${p.contractor?' · Contractor':''}</span></td><td>${esc(siteName(p.site))}</td><td>${esc(p.job)}</td><td>${badge(st,statusClass(st))}<div class="tiny muted">${n.done}/${n.total} lessons</div></td><td>${ev?badge('Observed (demo)','green'):badge('None','gray')}</td><td>${badge('Not issued','red')}</td></tr>`}).join('')}</tbody></table></div><div class="spread" style="margin-top:14px">${button('Previous page','matrix-prev',ui.matrixPage<=1?'disabled':'','btn small')}${button('Next page','matrix-next',ui.matrixPage>=pages?'disabled':'','btn small')}</div></section>`;}
function records(){const s=getState();const person=worker(ui.recordLearnerId)||s.learners[0];const courses=assignedCourses(person.id);const evs=s.evaluations.filter(x=>x.learnerId===person.id);return intro('Training Records','Explore a fictional learner evidence packet, then export example data for review.')+`<div class="notice" style="margin-bottom:18px">This is not an official training-record system. No Form 5000-23 is issued, no instructor identity is verified, and no regulatory certification is represented.</div><section class="section"><div class="spread"><h2>Fictional worker record</h2><label class="field-inline">Worker <select id="recordLearnerSelect" aria-label="Choose fictional worker">${s.learners.slice(0,100).map(p=>`<option value="${p.id}" ${p.id===person.id?'selected':''}>${esc(p.name)} (${p.id})</option>`).join('')}</select></label></div><div class="grid"><div><div class="section-label">Name</div><strong>${esc(person.name)}</strong><div class="small muted">${person.id}</div></div><div><div class="section-label">Operation</div><strong>${esc(siteName(person.site))}</strong></div><div><div class="section-label">Position</div><strong>${esc(person.job)}</strong>${person.contractor?`<div>${badge('Contractor','purple')}</div>`:''}</div></div><div class="flex" style="margin-top:16px">${button('Export worker evidence (JSON)','export-record',`data-learner="${person.id}"`,'btn primary')}${button('View Powered Haulage course','open-course','data-course="powered-haulage"')}</div></section><section class="section"><h2>Training evidence timeline</h2><div class="timeline">${courses.length?courses.map(c=>{const p=progressFor(c.id,person.id);const n=courseCompletion(c,person.id);return `<div class="timeline-item"><div class="timeline-dot"></div><div><strong>${esc(c.name)}</strong><p class="muted small">${badge(n.ready?'Instruction completed':'Instruction incomplete',n.ready?'green':'orange')} · ${n.done}/${n.total} lessons · Latest quiz ${p.quiz?`${p.quiz.score}%`:'not attempted'}</p><p class="tiny muted">${p.updatedAt?'Updated '+fmtDate(p.updatedAt):'No learner activity recorded'}</p></div></div>`}).join(''):'<p>No assignments recorded for this fictional worker.</p>'}${evs.map(e=>`<div class="timeline-item"><div class="timeline-dot" style="background:#14906a"></div><div><strong>Practical evaluation: ${esc(course(e.courseId)?.name||'Course')}</strong><p class="small">${badge('Observed in demo','green')} · ${esc(e.evaluator)} · ${fmtDate(e.date)}</p><p class="muted small">${esc(e.notes||'No observation notes')}</p></div></div>`).join('')}</div></section><section class="section"><h2>Regulatory training certification</h2><div class="warning danger-note"><strong>No official MSHA certification exists in this demonstration.</strong><p>Future production use requires an approved training-plan workflow, authorized certification, retained documentation, tamper-evident history, identity controls, reporting, and mine operator approval.</p></div></section>`;}
function settings(){return intro('Demo Settings','Export or reset your local, fictional training sandbox.')+`<section class="section"><h2>Prototype boundaries</h2><p>${badge('Functional local prototype','green')} ${badge('No authentication','red')} ${badge('No official records','orange')}</p><p class="muted small">Data lives in your browser's local storage on this device only; it does not synchronize. Clearing browser storage removes demonstration changes. Role selection is not permission enforcement.</p>${isMemoryOnly()?`<div class="warning">Browser storage is unavailable; changes remain only until the page reloads.</div>`:''}</section><section class="section"><h2>Save and restore fictional demo work</h2><div class="flex">${button('Export demo JSON','export-demo','','btn primary')}${button('Import demo JSON','import-demo')}${button('Reset all fictional data','reset-demo','','btn danger')}</div><input id="demoImportFile" type="file" accept=".json,application/json" hidden><p class="small muted">Never import real employee records into this demonstration. Imported files must have the expected demo schema and fictional learner markers.</p></section><section class="section"><h2>Production release gates — not implemented</h2><ul><li>Identity, multi-factor authentication and enforced role/site authorization</li><li>Secure database with validated write operations, backups and disaster recovery</li><li>Immutable or tamper-evident change history and tested record retention</li><li>Training plan mapping, instructor authorizations and regulatory certificate controls</li><li>Privacy, accessibility, load and security testing with operator acceptance</li></ul></section>`;}
function presenter(){const c=course(ui.courseId);if(!c)return '';if(!c.lessons.length)return `<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Instructor presentation"><h2>No lessons yet</h2><p>Add a lesson in Instructor Studio before starting the presentation.</p>${button('Close','present-close')}</div></div>`;const l=c.lessons[ui.presenterStep]||c.lessons[0];return `<div class="modal-overlay" id="presenterOverlay" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="Instructor presentation"><div class="spread" style="margin-bottom:12px"><strong>Instructor Presentation · ${esc(c.name)}</strong>${button('Close ✕','present-close','','btn small')}</div><div class="presenter"><div>${badge(`${ui.presenterStep+1} / ${c.lessons.length}`,'gray')}<p class="eyebrow" style="color:#c6e7ff;margin-top:25px">${esc(l.type.toUpperCase())} · ${l.minutes} MIN</p><h2>${esc(l.title)}</h2><p>${esc(l.content||l.questions?.[0]?.q||'Lesson discussion')}</p></div><div class="presenter-controls"><button class="btn" data-action="present-prev" ${ui.presenterStep===0?'disabled':''}>← Previous slide</button><span>SkyFire Education · Fictional demo</span><button class="btn primary" data-action="present-next" ${ui.presenterStep===c.lessons.length-1?'disabled':''}>Next slide →</button></div></div><div class="flex" style="margin-top:11px">${button(ui.presenterNotes?'Hide instructor notes':'Show instructor notes','toggle-notes','','btn small')}</div>${ui.presenterNotes?`<div class="presenter-notes"><strong>Instructor-only demo notes</strong><p>${esc(c.instructorNotes||'Prompt learners to connect this content with approved site procedures.')}</p></div>`:''}</div></div>`;}
function footer(){return `<footer class="footer"><strong>SkyFire Education Hub v0.1</strong> · Development demonstration · Fictional personnel and training data only · Independent from SkyFire Safety Library · No MSHA certification or production security provided</footer>`;}
function render(){const previousFocus=document.activeElement?.id;const previousPos=document.activeElement?.selectionStart;const page={dashboard,catalog,my:myLearning,course:courseView,studio,matrix,records,settings};$('#app').innerHTML=topbar()+`<div class="shell">${sidebar()}<main id="content" class="content">${(page[ui.view]||dashboard)()}</main></div>`+footer()+`${ui.presenter?presenter():''}${ui.toast?`<div class="toast" role="status">${esc(ui.toast)}</div>`:''}`;
 // Re-focus active search fields after a filtered re-render.

function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"';}
function download(name,text,type){const blob=new Blob([text],{type});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function exportMatrix(){const headers=['worker_id','worker','site','role','contractor','course','assignment','completed_lessons','total_lessons','quiz_score','practical_observed_demo','msha_certification'];const c=course('powered-haulage');const rows=shownLearners().map(p=>{const pp=progressFor(c.id,p.id),co=courseCompletion(c,p.id);return [p.id,p.name,siteName(p.site),p.job,p.contractor,c.name,outcome(c.id,p.id),co.done,co.total,pp.quiz?.score??'',Boolean(evaluation(c.id,p.id)),'NOT ISSUED'];});download('skyfire-fictional-training-matrix.csv',[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8');}
function exportRecord(learnerId){const person=worker(learnerId);if(!person)return;const assignments=getState().assignments.filter(a=>a.learnerId===learnerId);const progress=Object.fromEntries(Object.entries(getState().progress).filter(([k])=>k.endsWith(':'+learnerId)));const evaluations=getState().evaluations.filter(x=>x.learnerId===learnerId);download(`${learnerId}-fictional-learning-evidence.json`,JSON.stringify({warning:'DEMONSTRATION DATA ONLY — NOT AN MSHA TRAINING CERTIFICATE',person,assignments,progress,evaluations,regulatoryCertification:'NOT ISSUED'},null,2),'application/json');}
function endNarration(){if('speechSynthesis' in window)window.speechSynthesis.cancel();}
function startNarration(){const c=course(ui.courseId);const l=c?.lessons.find(x=>x.id===ui.lessonId);if(!l||l.type!=='audio')return;if(!('speechSynthesis' in window)){snack('This browser does not support narration. The transcript remains available.');return;}endNarration();const speech=new SpeechSynthesisUtterance(l.content);speech.rate=.9;speech.lang='en-US';window.speechSynthesis.speak(speech);snack('Narration started; the transcript remains visible.');}

function onClick(e){const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const act=btn.dataset.action;
 switch(act){
 case 'navigate':endNarration();navigate(btn.dataset.view);break;
 case 'open-course':endNarration();selectCourse(btn.dataset.course);break;
 case 'open-lesson':endNarration();ui.lessonId=btn.dataset.lesson;ui.quizFeedback=null;ui.scenarioFeedback=null;render();break;
 case 'lesson-prev':case 'lesson-next':{endNarration();const c=course(ui.courseId),i=c.lessons.findIndex(x=>x.id===ui.lessonId),next=i+(act==='lesson-next'?1:-1);if(c.lessons[next]){ui.lessonId=c.lessons[next].id;ui.quizFeedback=null;ui.scenarioFeedback=null;render();}break;}
 case 'complete-lesson':completeLesson(btn.dataset.course,btn.dataset.lesson);break;

 case 'present-course':endNarration();ui.courseId=btn.dataset.course;ui.presenter=true;ui.presenterStep=0;ui.presenterNotes=false;render();break;
 case 'present-next':{const c=course(ui.courseId);ui.presenterStep=Math.min(c.lessons.length-1,ui.presenterStep+1);render();break;}
 case 'present-prev':ui.presenterStep=Math.max(0,ui.presenterStep-1);render();break;

 }

function onSubmit(e){const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const values=new FormData(form),c=course(ui.studioCourseId);
 switch(form.dataset.form){
 case 'quiz':{const current=course(form.dataset.course),l=current?.lessons.find(x=>x.id===form.dataset.lesson);if(!l||!Array.isArray(l.questions))return;const items=l.questions.map((q,i)=>Number(values.get(`q${i}`))===q.correct?`Correct. ${q.why||''}`:`Not yet. ${q.why||''}`);const good=l.questions.filter((q,i)=>Number(values.get(`q${i}`))===q.correct).length;const score=percent(good,l.questions.length),passed=score>=75;const p=progressFor(current.id,ui.learnerId);updateProgress(current.id,ui.learnerId,{quiz:{score,passed,date:new Date().toISOString(),lessonId:l.id},completed:passed?[...new Set([...p.completed,l.id])]:p.completed.filter(x=>x!==l.id)});ui.quizFeedback={id:l.id,score,passed,items};render();snack(passed?'Knowledge assessment passed in demo.':'Assessment saved. Review feedback and retry.');break;}
 case 'scenario':{const current=course(form.dataset.course),l=current?.lessons.find(x=>x.id===form.dataset.lesson);if(!l)return;const correct=Number(values.get('scenario-answer'))===l.correct;const p=progressFor(current.id,ui.learnerId);updateProgress(current.id,ui.learnerId,{scenario:{correct,date:new Date().toISOString(),lessonId:l.id},completed:correct?[...new Set([...p.completed,l.id])]:p.completed.filter(x=>x!==l.id)});ui.scenarioFeedback={id:l.id,correct};render();break;}
 case 'edit-course':{if(!c)return;save(s=>{const d=s.courses.find(x=>x.id===c.id);d.name=String(values.get('title')).trim();d.academy=values.get('academy');d.scope=values.get('scope');d.audience=String(values.get('audience')).trim();d.summary=String(values.get('summary')).trim();});snack('Course changes saved locally.');break;}
 case 'new-course':{const title=String(values.get('title')).trim(),summary=String(values.get('summary')).trim();if(!title||!summary)return;const cid=id('course');save(s=>s.courses.push({id:cid,name:title,academy:values.get('academy'),audience:'Open elective (demo)',scope:'all',duration:'Flexible',status:'Instructor draft',required:false,summary,objectives:[],lessons:[],checklist:[],instructorNotes:''}));ui.studioCourseId=cid;snack('Demo course created. Add a lesson next.');break;}
 case 'add-lesson':{if(!c)return;const title=String(values.get('title')).trim(),content=String(values.get('content')).trim(),type=values.get('type');if(!title||!content)return;const x={id:id('lesson'),title,content,type,minutes:8};if(type==='scenario'||type==='quiz'){const options=String(values.get('options')).split('\n').map(x=>x.trim()).filter(Boolean);const correct=Number(values.get('correct'))-1;if(options.length<2||correct<0||correct>=options.length){snack('Enter at least two choices and a valid correct answer number.');return;}if(type==='scenario'){x.options=options;x.correct=correct;x.feedback='Review the decision against the approved site procedure before applying it in the field.';}else x.questions=[{q:content,options,correct,why:'Discuss the answer with the instructor and consult the applicable site procedure.'}];}save(s=>s.courses.find(x=>x.id===c.id).lessons.push(x));snack('Lesson added to demo course.');break;}
 case 'assign-course':{if(!c)return;const target=values.get('target'),ids=target==='site'?shownLearners().map(x=>x.id):[values.get('learnerId')];if(ids.length===0){snack('No learners in current site filter.');return;}assignCourse(c.id,ids);snack(`Course assignment applied to ${ids.length} fictional learner(s).`);break;}
 case 'evaluation':{if(!c)return;const person=values.get('learnerId');if(!worker(person))return;save(s=>s.evaluations.push({id:id('eval'),courseId:c.id,learnerId:person,evaluator:String(values.get('evaluator')).trim(),date:new Date().toISOString(),notes:String(values.get('notes')).trim(),checks:(c.checklist?.length?c.checklist:['Communicates the task hazards and required controls','Demonstrates the expected procedure','Responds appropriately to an unexpected condition']),fictional:true}));ui.recordLearnerId=person;snack('Fictional practical evaluation recorded.');break;}
 }
}
function onKey(e){if(!ui.presenter)return;if(e.key==='Escape'){ui.presenter=false;render();}if(e.key==='ArrowRight'){const c=course(ui.courseId);ui.presenterStep=Math.min(c.lessons.length-1,ui.presenterStep+1);render();}if(e.key==='ArrowLeft'){ui.presenterStep=Math.max(0,ui.presenterStep-1);render();}}
document.addEventListener('click',onClick);document.addEventListener('change',onChange);document.addEventListener('input',onInput);document.addEventListener('submit',onSubmit);document.addEventListener('keydown',onKey);subscribe(render);getState();render();
</script></body></html>
